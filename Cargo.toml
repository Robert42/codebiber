[package]
name = "codebiber"
version = "0.1.0"
edition="2021"
license="Apache-2.0"
rust-version="1.63"

description = "Library for mixing handwritten and autogenerated code."
repository = "https://github.com/Robert42/codebiber"
keywords = ["codegen"]

[dependencies]
blake3 = "=1.4.0"
thiserror = "1.0.50"

[dev-dependencies]
proptest = "1.4.0"
lazy-regex = "3.1.0"
unwrap_display = "0.0.1"
